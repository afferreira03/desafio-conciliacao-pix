server:
  port: 8081

spring:
  application:
    name: conciliacao-pix

  mongodb:
    uri: mongodb://localhost:27017/conciliacao-pix?replicaSet=rs0

  data:
    mongodb:
      auto-index-creation: true

  mvc:
    problemdetails:
      enabled: true

  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: pix-reconciliation-group
      auto-offset-reset: earliest

app:
  kafka:
    topics:
      pix-transactions: pix.transactions
      pix-transactions-dlt: pix.transactions.DLT
      pix-reconciliation-result: pix.reconciliation.result
    consumer:
      # Partições só aumentam (Kafka não reduz). Threads > partições ficam ociosas.
      partitions: ${PIX_PARTITIONS:6}
      concurrency: ${PIX_CONCURRENCY:6}
  timeknobs:
    outbox:
      send-timeout-ms: 30000
      poll-interval-ms: 1000
      batch-size: 500

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  # Correlação por mensagem (MdcRecordInterceptor): endToEndId e posição no tópico em cada linha de log.
  # O %replace remove o prefixo vazio nas linhas sem mensagem em processamento (startup, relay etc.).
  pattern:
    correlation: '%replace([e2e=%X{endToEndId:-} %X{kafka:-}] ){''\[e2e= \] '', ''''}'
  level:
    root: "INFO"
    br.com.desafio.conciliacaopix: INFO

